<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07281d">
  <title>Roulette Royale</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23b3202a' stroke='%23d6b25e' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d6b25e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toasts" aria-live="polite"></div>
  <div id="conn-banner" hidden data-i18n>Verbinding verbroken. Opnieuw verbinden…</div>

  <!-- ===================== START SCREEN ===================== -->
  <section id="view-start" class="view">
    <div class="lang-switch start-lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button>
    </div>
    <div class="start-card">
      <div class="logo-chip" aria-hidden="true"></div>
      <h1>Roulette Royale</h1>
      <p class="tagline"><span data-i18n>Speel samen met vrienden.</span> <b data-i18n>Alleen virtuele fiches, geen echt geld.</b></p>

      <label class="field"><span data-i18n>Bijnaam</span>
        <input id="inp-name" maxlength="16" autocomplete="nickname" placeholder="E.g. LuckyLuke" data-i18n-placeholder="Bijv. LuckyLuke">
      </label>

      <button id="btn-create" class="btn gold big" data-i18n>Maak kamer</button>

      <div class="or"><span data-i18n>of join een kamer</span></div>

      <div class="join-row">
        <label class="field grow"><span data-i18n>Kamercode</span>
          <input id="inp-code" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCDE" class="code-input">
        </label>
        <button id="btn-join" class="btn big">Join</button>
      </div>

      <button id="btn-rejoin" class="btn ghost" hidden></button>
      <p id="start-error" class="form-error" role="alert"></p>
      <p class="fine" data-i18n>Alleen virtuele fiches - geen echt geld.</p>
    </div>
  </section>

  <!-- ===================== GAME SCREEN ===================== -->
  <section id="view-game" class="view" hidden>
    <header class="topbar">
      <button id="btn-code" class="codechip" title="Click to copy the code" data-i18n-title="Klik om de code te kopiëren">
        <span class="lbl" data-i18n>KAMER</span><b id="room-code">-----</b>
      </button>
      <button id="btn-link" class="btn small ghost" title="Copy invite link" data-i18n-title="Kopieer uitnodigingslink" data-i18n>Link kopiëren</button>
      <div class="phase" id="phase"><span id="phase-label"></span><span id="timer"></span></div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button>
      </div>
      <button id="btn-sound" class="btn small ghost" title="Sound on/off" data-i18n-title="Geluid aan/uit" data-i18n-aria-label="Geluid aan/uit">🔊</button>
      <button id="btn-leave" class="btn small ghost" data-i18n>Verlaat</button>
    </header>

    <main class="layout">
      <div class="main-col">
        <div class="stage">
          <div class="wheel-wrap" id="wheel-wrap">
            <canvas id="wheel" aria-label="Roulette wheel" data-i18n-aria-label="Roulettewiel"></canvas>
            <div id="result-banner" hidden></div>
            <div id="pause-badge" hidden data-i18n>⏸ Gepauzeerd</div>
          </div>
          <div class="stage-info">
            <div class="balance">
              <span class="lbl" data-i18n>Jouw fiches</span>
              <b id="my-chips">0</b>
              <small id="my-staked"></small>
            </div>
            <div class="lbl" data-i18n>Laatste uitslagen</div>
            <div id="history" class="history"></div>
            <div id="hotcold" class="hotcold"></div>
            <div id="hint" class="hint"></div>
          </div>
        </div>

        <div class="table-wrap" id="table-wrap">
          <div id="table" class="table"></div>
        </div>

        <div class="controls" id="controls">
          <div class="chip-row" id="chip-row"></div>
          <div class="action-row">
            <button class="btn small" id="btn-undo" data-i18n>↶ Ongedaan</button>
            <button class="btn small" id="btn-clear" data-i18n>Wis alles</button>
            <button class="btn small" id="btn-repeat" data-i18n>Herhaal vorige</button>
            <button class="btn small" id="btn-double" data-i18n>Verdubbel</button>
          </div>
        </div>
      </div>

      <aside class="side-col">
        <section id="host-panel" class="card" hidden></section>

        <section class="card">
          <h2><span data-i18n>Spelers</span> <span id="player-count" class="count"></span></h2>
          <div id="players" class="players"></div>
        </section>

        <section class="card chat-card">
          <h2>Chat</h2>
          <div id="chat-log" class="chat-log"></div>
          <form id="chat-form" class="chat-form" autocomplete="off">
            <input id="chat-input" maxlength="200" placeholder="Type a message…" data-i18n-placeholder="Typ een bericht…">
            <button class="btn small gold" type="submit" data-i18n>Stuur</button>
          </form>
        </section>
      </aside>
    </main>
  </section>

  <div id="modal" class="modal" hidden></div>

  <button id="btn-changelog" class="changelog-btn" type="button"><span id="cl-dot" class="cl-dot" hidden></span><span data-i18n>Updatelog</span></button>

  <script src="rules.js"></script>
  <script src="i18n.js"></script>
  <script src="changelog.js"></script>
  <script src="app.js"></script>
</body>
</html>
